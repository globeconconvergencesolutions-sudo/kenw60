services:
  kenw60-hub:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # only reachable through Nginx on the same server; use "3000:3000" to expose directly
    volumes:
      - ./data:/app/data
    env_file:
      - .env                     # copy .env.example to .env and fill it in – never commit .env
    stop_grace_period: 15s
